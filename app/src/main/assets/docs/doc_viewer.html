<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KotSafe Documentation</title>
  <script src="marked.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --heading-color: #58a6ff;
      --link-color: #58a6ff;
      --code-bg: #1f242c;
      --code-text: #f0f6fc;
      --table-stripe: #161b22;
      --table-header: #21262d;
      --accent-color: #238636;
      --quote-border: #388bfd;
      --quote-bg: #0d1e38;
    }

    body.light-theme {
      --bg-color: #ffffff;
      --card-bg: #f6f8fa;
      --border-color: #d0d7de;
      --text-color: #24292f;
      --heading-color: #0969da;
      --link-color: #0969da;
      --code-bg: #f6f8fa;
      --code-text: #1f2328;
      --table-stripe: #f6f8fa;
      --table-header: #eaeef2;
      --accent-color: #1a7f37;
      --quote-border: #0969da;
      --quote-bg: #ddf4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px 16px 48px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      background-color: var(--bg-color);
      color: var(--text-color);
      word-wrap: break-word;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--heading-color);
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 600;
      line-height: 1.3;
    }

    h1 {
      font-size: 1.65em;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    h2 {
      font-size: 1.35em;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    h3 {
      font-size: 1.15em;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    p {
      margin-top: 0;
      margin-bottom: 14px;
    }

    ul, ol {
      padding-left: 24px;
      margin-top: 0;
      margin-bottom: 14px;
    }

    li {
      margin-bottom: 6px;
    }

    blockquote {
      margin: 12px 0;
      padding: 10px 14px;
      border-left: 4px solid var(--quote-border);
      background-color: var(--quote-bg);
      border-radius: 4px;
    }

    code {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13.5px;
      padding: 2.5px 6px;
      background-color: var(--code-bg);
      color: var(--code-text);
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    pre {
      position: relative;
      background-color: var(--code-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin: 14px 0;
    }

    pre code {
      padding: 0;
      border: none;
      background: transparent;
      font-size: 13px;
      display: block;
      line-height: 1.5;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      cursor: pointer;
      opacity: 0.8;
    }

    .copy-btn:hover {
      opacity: 1;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      display: block;
      overflow-x: auto;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
      font-size: 13.5px;
    }

    th {
      background-color: var(--table-header);
      font-weight: 600;
    }

    tr:nth-child(even) td {
      background-color: var(--table-stripe);
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 24px 0;
    }

    .header-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 12px;
      background-color: var(--accent-color);
      color: #ffffff;
      margin-bottom: 12px;
    }

    #loading {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-color);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading documentation...</div>
  <div id="content" style="display: none;"></div>

  <script>
    function setTheme(isDark) {
      if (isDark) {
        document.body.classList.remove('light-theme');
      } else {
        document.body.classList.add('light-theme');
      }
    }

    function renderMarkdown(mdText) {
      try {
        const html = marked.parse(mdText);
        const container = document.getElementById('content');
        container.innerHTML = html;
        document.getElementById('loading').style.display = 'none';
        container.style.display = 'block';

        // Add copy buttons to code blocks
        document.querySelectorAll('pre').forEach((pre) => {
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.innerText = 'Copy';
          btn.onclick = function() {
            const code = pre.querySelector('code');
            if (code) {
              navigator.clipboard.writeText(code.innerText).then(() => {
                btn.innerText = 'Copied!';
                setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
              });
            }
          };
          pre.appendChild(btn);
        });
      } catch (e) {
        document.getElementById('loading').innerText = "Error rendering guide: " + e;
      }
    }
  </script>
</body>
</html>
