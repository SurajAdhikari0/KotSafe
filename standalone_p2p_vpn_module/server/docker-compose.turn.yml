services:
  turn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?set the same TURN secret as control}
      - --realm=${TURN_HOST:?set the TURN DNS name}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --cert=/run/secrets/relay-cert.pem
      - --pkey=/run/secrets/relay-key.pem
      - --denied-peer-ip=127.0.0.1
    volumes:
      - ${TLS_KEY_FILE:?set absolute key path}:/run/secrets/relay-key.pem:ro
      - ${TLS_CERT_FILE:?set absolute certificate path}:/run/secrets/relay-cert.pem:ro
    tmpfs:
      - /tmp
