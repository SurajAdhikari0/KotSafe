app = "kotsafe-relay"
primary_region = "iad"

[build]
  dockerfile = "signaling-server/Dockerfile"

[env]
  PORT = "8081"
  PAIRING_TTL_SECONDS = "86400"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
