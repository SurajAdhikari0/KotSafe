version: "3.8"

services:
  signaling-server:
    build: ./signaling-server
    container_name: kotsafe-signaling
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SHARED_SECRET=${SHARED_SECRET}
      - ALLOW_ANONYMOUS=${ALLOW_ANONYMOUS:-false}
      - PAIRING_TTL_SECONDS=${PAIRING_TTL_SECONDS:-86400}

  coturn:
    image: coturn/coturn:latest
    container_name: kotsafe-coturn
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  caddy:
    image: caddy:2-alpine
    container_name: kotsafe-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - signaling-server

volumes:
  caddy_data:
