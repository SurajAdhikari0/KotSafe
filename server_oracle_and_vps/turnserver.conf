# coturn config template for kotsafe-relay
# Fill in the placeholders, then restart the coturn container.

listening-port=3478
tls-listening-port=5349

# Relay port range — must be opened UDP in your cloud provider's firewall/security list.
min-port=49152
max-port=65535

# Use a long-term shared secret instead of static user/pass pairs.
use-auth-secret
static-auth-secret=cc1d91ed5dda86b294a001befb6fc66a01898f29261aff16c86fc7c9ab994be6

realm=130.210.16.110
server-name=130.210.16.110

# Public IP of this VM (needed for NAT'd/cloud instances where the VM's
# local interface IP differs from its public IP — this is the normal case
# on Oracle Cloud, AWS, etc.)
external-ip=130.210.16.110

fingerprint
lt-cred-mech

# Don't relay to internal/private ranges — prevents this TURN server being
# abused to reach your own VM's internal network, cloud metadata (169.254.169.254), or other tenants.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=0.0.0.0-0.255.255.255

no-cli
no-tlsv1
no-tlsv1_1

log-file=stdout
verbose
